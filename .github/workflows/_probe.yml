name: probe (temporary)

on:
  push:
    branches: [arena/01a0bcf4-nobitexagentwin]
    paths:
      - '.github/workflows/_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Network reachability
        run: |
          set +e
          for url in \
            "https://api.nobitex.ir/market/stats?srcCurrency=btc&dstCurrency=rls" \
            "https://api.nobitex.ir/market/udf/history?symbol=BTCIRT&resolution=15&from=1750000000&to=1758000000" \
            "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=2" \
            "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=2" \
            "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=15" \
            "https://api.bitfinex.com/v2/candles/trade:15m:tBTCUSD/hist?limit=2" \
            "https://api.bitstamp.net/api/v2/ohlc/btcusd/?step=900&limit=2" \
            "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=15m&limit=2" \
            "https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=15&limit=2" \
            "https://api.coingecko.com/api/v3/ping" \
            "https://min-api.cryptocompare.com/data/v2/histominute?fsym=BTC&tsym=USD&limit=2" \
            ; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 20 "$url")
            echo "== $code  ${url%%\?*}"
            head -c 220 /tmp/out | tr -d '\n' | sed 's/[[:space:]]\+/ /g'
            echo
          done
        shell: bash

      - name: Nobitex market list (IRT pairs, top volume)
        run: |
          set +e
          curl -s --max-time 25 "https://api.nobitex.ir/market/stats" -o /tmp/stats.json
          echo "bytes: $(wc -c < /tmp/stats.json)"
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/stats.json'))
          except Exception as e:
              print("parse failed:", e); raise SystemExit
          st=d.get('stats') or {}
          rows=[]
          for k,v in st.items():
              if not k.endswith('rls'): continue
              rows.append((float(v.get('volume') or 0), k, v.get('latest'), v.get('dayChange')))
          rows.sort(reverse=True)
          print("irt pairs:", len(rows))
          for r in rows[:15]:
              print("  ", r[1], "last", r[2], "dayChange", r[3], "vol", r[0])
          print("status:", d.get('status'))
PY
        shell: bash

      - name: Push capability
        run: |
          set +e
          git config user.name "probe-bot"
          git config user.email "probe@example.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .probe_timestamp
          git add -f .probe_timestamp
          git commit -m "probe: runner push test [skip ci]" || echo "nothing to commit"
          git push
          echo "push exit: $?"
